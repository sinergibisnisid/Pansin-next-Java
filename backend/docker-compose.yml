name: pansin-access

services:
  postgres:
    image: postgres:16-alpine
    container_name: pansin-postgres
    environment:
      POSTGRES_DB: pansin
      POSTGRES_USER: pansin
      POSTGRES_PASSWORD: pansin
      TZ: Asia/Jakarta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pansin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pansin-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  mosquitto:
    profiles: ["infra-optional"]
    image: eclipse-mosquitto:2.0
    container_name: pansin-mosquitto
    ports:
      - "1883:1883"     # MQTT
      - "8883:8883"     # MQTTS
      - "9001:9001"     # WebSocket
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  zookeeper:
    profiles: ["infra-optional"]
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pansin-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    profiles: ["infra-optional"]
    image: confluentinc/cp-kafka:7.6.0
    container_name: pansin-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    restart: unless-stopped

  pansin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pansin-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/pansin
      DB_USERNAME: pansin
      DB_PASSWORD: pansin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED:-false}
      MQTT_URL: ${MQTT_URL:-tcp://localhost:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-pansin}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-pansin}
      JWT_SECRET: change-me-with-a-very-long-random-base64-secret-key-please-rotate
    ports:
      - "8080:8080"
    volumes:
      - api-storage:/app/storage
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.0
    container_name: pansin-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    container_name: pansin-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: pansin-admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped

  nginx:
    profiles: ["infra-optional"]
    image: nginx:1.27-alpine
    container_name: pansin-nginx
    depends_on:
      - pansin-api
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  api-storage:
  prometheus-data:
  grafana-data:
